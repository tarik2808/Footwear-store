<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear Store - Test Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Footwear Store - Functionality Test</h1>
        
        <div class="card mt-4">
            <div class="card-header">
                <h3>Authentication Tests</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <h4>Register Test</h4>
                    <form id="registerTest">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="testName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="testEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="testPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Test Register</button>
                    </form>
                </div>

                <div class="mb-3">
                    <h4>Login Test</h4>
                    <form id="loginTest">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Test Login</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h3>Product Tests</h3>
            </div>
            <div class="card-body">
                <button id="testGetProducts" class="btn btn-primary">Test Get Products</button>
                <div id="productsResult" class="mt-3"></div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h3>Cart Tests</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Product ID</label>
                    <input type="number" class="form-control" id="testProductId">
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="testQuantity" value="1">
                </div>
                <button id="testAddToCart" class="btn btn-primary">Test Add to Cart</button>
                <button id="testGetCart" class="btn btn-primary ms-2">Test Get Cart</button>
                <div id="cartResult" class="mt-3"></div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h3>Test Results</h3>
            </div>
            <div class="card-body">
                <div id="testResults" class="alert alert-info">
                    No tests run yet.
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import authService from './services/authService.js';
        import productService from './services/productService.js';
        import cartService from './services/cartService.js';
        import Validation from './utils/validation.js';

        // Register Test
        document.getElementById('registerTest').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('testName').value;
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;

            try {
                const result = await authService.register(name, email, password);
                updateTestResults('Register Test', true, result);
            } catch (error) {
                updateTestResults('Register Test', false, error.message);
            }
        });

        // Login Test
        document.getElementById('loginTest').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const result = await authService.login(email, password);
                updateTestResults('Login Test', true, result);
            } catch (error) {
                updateTestResults('Login Test', false, error.message);
            }
        });

        // Get Products Test
        document.getElementById('testGetProducts').addEventListener('click', async () => {
            try {
                const products = await productService.getAllProducts();
                document.getElementById('productsResult').innerHTML = 
                    `<pre>${JSON.stringify(products, null, 2)}</pre>`;
                updateTestResults('Get Products Test', true, 'Products retrieved successfully');
            } catch (error) {
                updateTestResults('Get Products Test', false, error.message);
            }
        });

        // Add to Cart Test
        document.getElementById('testAddToCart').addEventListener('click', async () => {
            const productId = document.getElementById('testProductId').value;
            const quantity = document.getElementById('testQuantity').value;

            try {
                const result = await cartService.addToCart(productId, quantity);
                updateTestResults('Add to Cart Test', true, result);
            } catch (error) {
                updateTestResults('Add to Cart Test', false, error.message);
            }
        });

        // Get Cart Test
        document.getElementById('testGetCart').addEventListener('click', async () => {
            try {
                const cart = await cartService.getCart();
                document.getElementById('cartResult').innerHTML = 
                    `<pre>${JSON.stringify(cart, null, 2)}</pre>`;
                updateTestResults('Get Cart Test', true, 'Cart retrieved successfully');
            } catch (error) {
                updateTestResults('Get Cart Test', false, error.message);
            }
        });

        function updateTestResults(testName, success, result) {
            const testResults = document.getElementById('testResults');
            const timestamp = new Date().toLocaleTimeString();
            const status = success ? '✅' : '❌';
            const resultText = typeof result === 'object' ? JSON.stringify(result, null, 2) : result;
            
            testResults.innerHTML += `
                <div class="mb-2">
                    <strong>${timestamp} - ${testName}</strong> ${status}<br>
                    <small>${resultText}</small>
                </div>
            `;
        }
    </script>
</body>
</html>
